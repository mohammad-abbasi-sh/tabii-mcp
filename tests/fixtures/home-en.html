ical","name":"46614_0-0-1363-2046.png","subDescription":"Stories that bond us ","title":"welcome_v_eng"}],"title":"","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}}],"pageItemType":"carousel","periods":null,"subscriptionCategories":null,"title":""}],"promoter":[{"description":"Step into a fascinating world of exclusive entertainment!","images":null,"info":"","items":[{"description":"Criminal psychologist and bestselling author Yiğit Dağlı is under investigation when his latest thriller eerily depicts the exact scenes of a series of recent murders. It is only when he gets his ex-wife, Burcu, a former investigator currently suspended, on the case that he begins to reveal his carefully crafted game. After clearing his name, Yiğit joins the investigation team, and together they tackle high-profile cases, but the consequences of his game soon catch up with him. He must confront the shadows of his past, face the weight of his mistakes, and risk everything for the woman he loves.\n","id":571015,"images":[{"contentType":"image","imageType":"main","name":"56764_0-0-2557-3840.png"}],"slug":"persona","title":"Persona ","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"A Turkish mortician in his 30s, Baki is an introverted man content with his isolation from society. However, when he comes up against death at close range, a troubling question strikes him: who would wash his body after he dies? This realization pushes him to venture out into the world, hoping to connect with people and perhaps even find a spouse. Yet, his life-changing decision proves difficult to go through with, leading to a series of awkwardly humorous and sometimes bizarre situations.","id":438813,"images":[{"contentType":"image","imageType":"main","name":"63516_0-0-2557-3840.jpeg"}],"slug":"gassal","title":"The Late Offices","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"During Operation Brave Flag in northern Syria, a Turkish tank unit is cut off from its main force after terrorists destroy a key bridge. Faced with a harsh choice—destroy their tank and await rescue, or dig in and fight—they must outmaneuver a ruthless warlord to make it out alive with minimal military and civilian casualties.\n","id":523675,"images":[{"contentType":"image","imageType":"main","name":"52262_0-0-2557-3840.png"}],"slug":"siyah-bere","title":"The Black Berets","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Mesut comes to İstanbul to sell the company where his father has given him power of attorney for two percent of the shares. He ends up staying longer than planned, coinciding with an opportunity to reconnect with Beste, a former crush of his.\n","id":518214,"images":[{"contentType":"image","imageType":"main","name":"59797_0-0-2557-3840.png"}],"slug":"yuzde-iki","title":"Two Percent","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Since the late ’90s, Türkiye has struggled with “state within a state” structures, organizations that manipulate bureaucrats and businesspeople like puppets to steal the nation’s wealth for the benefit of a small elite. Each season of the series follows the stories of idealistic characters determined to break free from this corrupt system and fight against its pervasive influence.\n","id":498136,"images":[{"contentType":"image","imageType":"main","name":"62079_0-0-2557-3840.png"}],"slug":"yanki-ikinci-perde","title":"Echo: Act Two","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Devastated by the loss of his comrade and the relics left behind, the self-styled 'apprentice,' also known as \"Terekeme\", sets out on a vengeful quest after uncovering the true nature of the company he serves, which claims to deliver justice through assassinations. Over time, he transforms into a cold, emotionless assassin.","id":433523,"images":[{"contentType":"image","imageType":"main","name":"46626_0-0-2557-3840.png"}],"slug":"cirak","title":"The Fifth Vigilante","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Şahin, who once worked for a notorious crime boss, discovers that he has a daughter from his ex-wife Reyhan, whom he parted ways with years ago. Determined to leave his past behind, he moves to the town where his family lives. But will the criminal world let him walk away that easily?","id":520109,"images":[{"contentType":"image","imageType":"main","name":"51980_0-0-2557-3840.png"}],"slug":"kiz-babasi","title":"Her Father","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Two families, the Quadris from Pakistan and the Bolios from Mexico, each with four members, receive an invitation for an extraordinary vacation in Istanbul. They fully immerse themselves in the city's essence, exploring everything from its hidden backstreets to the chic neighborhoods featured in the world-famous Turkish series. They eat, drink, and breathe in the vibrant spirit of Istanbul.","id":182973,"images":[{"contentType":"image","imageType":"main","name":"45874_0-0-2557-3840.png"}],"slug":"ruya-gibi-istanbul","title":"Like a Dream: Istanbul","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Sufi poet Rumi leaves for west to escape the nearing Mongol hordes, but his real journey is of spirituality that teaches him his purpose in life through a deeper connection to the divine, culminating with a philosophy on understanding self.","id":154554,"images":[{"contentType":"image","imageType":"main","name":"49586_0-0-2557-3840.png"}],"slug":"mevlana-celaleddin-i-rumi","title":"Rumi","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Ali Reşat, a man of traditions, is released with an amnesty after many years in prison. While plotting revenge against his enemies in the mafia who put him in this situation, he seeks ways to win back his estranged son.","id":426079,"images":[{"contentType":"image","imageType":"main","name":"43891_0-0-2557-3840.png"}],"slug":"marnali","title":"A Mafia Odyssey","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Halil, conspired against and imprisoned, is banished to the notorious Sinop prison, known for its harsh conditions. Realizing he won’t last long in prison, he devises a plan to escape and seek revenge on those who forced him into this life.","id":488808,"images":[{"contentType":"image","imageType":"main","name":"48182_0-0-2557-3840.png"}],"slug":"surgunler","title":"The Underlings","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Arif and his daughter Ela try to escape the city in an ambulance with their neighbor Melek after an explosion in the Sun creates chaos. While the journey inevitably leads to confrontations for everyone, Arif almost feels reconnected to himself after being crushed under the expectations of modern life for years.","id":155856,"images":[{"contentType":"image","imageType":"main","name":"35152_0-0-2557-3840.png"}],"slug":"derin-mor","title":"Deep Purple","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Part documentary and part fiction, this story brings to life the memories of one of the heroes of the Turkish War of Liberation. During İstanbul's occupation by the Western forces, Ottoman police officer Cemil clashes with French soldiers, resulting in his being handed over to the occupier courts and sentenced to many years in prison. This sentence takes him too far away from his home: to Devil's Island in French Guiana. During his sentence, Cemil fights an uphill battle for survival and eventually returns to a newly founded Türkiye.\n","id":513194,"images":[{"contentType":"image","imageType":"main","name":"51284_0-0-2557-3840.png"}],"slug":"seytan-adasinda-esir-turk-polis-cemil","title":"10 Years on the Devil's Island","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"In İstanbul's upscale Cihangir neighborhood, home to the city's entertainment, art, and cinema elite, Barış and Irmak, an artist couple, struggle to stay together despite the odds. In contrast, Saygın and Pelin are on the brink of divorce. A diverse cast of characters surrounds them: Ülkü, an actress considering having a fatherless child to find purpose; Emir, an aspiring director grappling with shame about his roots; Gültekin, an older author falling for a much younger woman; Meray, a woman caught in conflicting currents; and a group of pseudo-intellectuals led by the self-styled mentor Nedim, who leads a lonely life. All are adrift in an artificial influence they can't quite identify.","id":490953,"images":[{"contentType":"image","imageType":"main","name":"48756_0-0-2557-3840.png"}],"slug":"cihangir-cumhuriyeti","title":"The Embrace of Awaiting Clouds","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"A few years have already passed and the small town of Green Sea remains the same, however, the lives of our characters have undergone great changes. In this brand-new story, we will witness the latest adventures of İsmail and his companions.","id":155865,"images":[{"contentType":"image","imageType":"main","name":"57326_0-0-2557-3840.jpeg"}],"slug":"yesil-deniz-milenyum","title":"Green Sea: Millennium","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Tozkoparan İskender gets special powers by touching a meteorite that fell hundreds of years ago and becomes the most skilled archer. He finds himself facing an enemy from the future who threatens to disrupt the balance of time and spread evil. With the help of his friends, İskender will start a war to stop evil from taking over.","id":154771,"images":[{"contentType":"image","imageType":"main","name":"43490_0-0-2557-3840.jpeg"}],"slug":"tozkoparan-iskender-golge","title":"Little Archer: Iskender vs Shadow","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Curious about people's relationship with death, Vedat is a psychologist who designs an experiment to follow the behaviors of six participants who are informed that they will die on the same day. All six participants react uniquely to this piece of information and try to come to terms with their untimely death.","id":154695,"images":[{"contentType":"image","imageType":"main","name":"26442_0-0-2557-3840.png"}],"slug":"son-gun","title":"The Last Day","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Amidst the ravages of WWI and the conflicts within the country, Akif tries to keep his family together and encourages the youth to unite against the enemy. With his pen mightier than the sword, he writes the National Anthem of the new Türkiye.","id":154428,"images":[{"contentType":"image","imageType":"main","name":"22004_0-0-2557-3840.jpeg"}],"slug":"akif","title":"Akif","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Ecem and Cenk have been happily married for 3 years, but they start to face obstacles as their relationship enters a new stage. They find themselves concerned and unsure how to continue with the marriage. Still, the couple holds on to each other and try to overcome their differences.","id":154480,"images":[{"contentType":"image","imageType":"main","name":"37221_0-0-2557-3840.png"}],"slug":"askimiz-yeter","title":"Marriage et al.","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Alija Izetbegović, a prominent political leader, tries to hold his country together while negotiating an agreement that will mean the end of the war. At the same time, the story of the Kahramanović family offers an insider's perspective on the war.","id":155427,"images":[{"contentType":"image","imageType":"main","name":"21964_0-0-2557-3840.jpeg"}],"slug":"dayton","title":"Dayton","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Ibn Sina is an intelligent and curious boy with an unquenchable thirst for knowledge, which leads him to interact with different characters who contribute to his education and training, making him one of the most renowned scholars in history.","id":155517,"images":[{"contentType":"image","imageType":"main","name":"57399_0-0-2557-3840.png"}],"slug":"kucuk-dahi-ibn-i-sina","title":"Young Ibn Sina","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"The Ottoman Sultan Murad II decides to summon the famous master Akşemseddin to the palace and put him in charge of his son Mehmet's education. The knowledge acquired by the prince will lead him to leave his mark on history.","id":156178,"images":[{"contentType":"image","imageType":"main","name":"25549_0-0-2557-3840.jpeg"}],"slug":"kizil-elma-bir-fetih-oykusu","title":"Golden Apple: The Grand Conquest","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}}],"pageItemType":"promoter","periods":null,"subscriptionCategories":null,"title":"Exclusive Content on tabii"},{"description":"Feel the excitement in every episode of the newest and most popular productions, while experiencing the difference with tabii Originals.","images":null,"info":"","items":[{"description":"A Turkish mortician in his 30s, Baki is an introverted man content with his isolation from society. However, when he comes up against death at close range, a troubling question strikes him: who would wash his body after he dies? This realization pushes him to venture out into the world, hoping to connect with people and perhaps even find a spouse. Yet, his life-changing decision proves difficult to go through with, leading to a series of awkwardly humorous and sometimes bizarre situations.","id":438813,"images":[{"contentType":"image","imageType":"main","name":"63516_0-0-2557-3840.jpeg"}],"slug":"gassal","title":"The Late Offices "}],"slug":"marnali","title":"A Mafia Odyssey","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"A few years have already passed and the small town of Green Sea remains the same, however, the lives of our characters have undergone great changes. In this brand-new story, we will witness the latest adventures of İsmail and his companions.","id":155865,"images":[{"contentType":"image","imageType":"main","name":"57326_0-0-2557-3840.jpeg"}],"slug":"yesil-deniz-milenyum","title":"Green Sea: Millennium","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Since the late ’90s, Türkiye has struggled with “state within a state” structures, organizations that manipulate bureaucrats and businesspeople like puppets to steal the nation’s wealth for the benefit of a small elite. Each season of the series follows the stories of idealistic characters determined to break free from this corrupt system and fight against its pervasive influence.\n","id":498136,"images":[{"contentType":"image","imageType":"main","name":"62079_0-0-2557-3840.png"}],"slug":"yanki-ikinci-perde","title":"Echo: Act Two","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Mesut comes to İstanbul to sell the company where his father has given him power of attorney for two percent of the shares. He ends up staying longer than planned, coinciding with an opportunity to reconnect with Beste, a former crush of his.\n","id":518214,"images":[{"contentType":"image","imageType":"main","name":"59797_0-0-2557-3840.png"}],"slug":"yuzde-iki","title":"Two Percent","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Gilani the Ascetic sets out to Baghdad seeking truth along with Eşref. Following an enduring seclusion, he finds out that the city of Baghdad is in chaos and he begins his historic struggle for equality and peace.","id":155442,"images":[{"contentType":"image","imageType":"main","name tType":"","id":0,"isRepetition":false,"title":""}},{"description":"The Turkish Intelligence Service creates a team of experts in various fields, but the members have to compromise their public life as they will be considered dead from now on.","id":6750,"images":[{"contentType":"image","imageType":"main","name":"69064_0-0-2557-3840.jpeg"}],"slug":"teskilat","title":"The Shadow Team","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Polymath, polyglot, strategist, and youthful sultan, Mehmed II harbors one grand ambition: to conquer the city of İstanbul and succeed the Roman Empire as the new Caesar. And he doesn't stop there.","id":316389,"images":[{"contentType":"image","imageType":"main","name":"67888_0-0-2557-3840.png"}],"slug":"mehmed-fetihler-sultani","title":"Fatih: Sultan of Conquests","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Loosely based on the epic love story by the same name, Leyla and Mecnun narrate the absurd tale of a man seeking his betrothed-at-birth love against ironic coincidences.","id":6080,"images":[{"contentType":"image","imageType":"main","name":"33272_0-0-2557-3840.png"}],"slug":"leyla-ile-mecnun","title":"Leyla and Mecnun","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"The steppe is known for telling the stories of tough love and unlikely reunions. Taner is still not over his childhood sweetheart Dilek leaving their small town. As he nurses a small hope of their paths crossing one day, he spends his days building a plane.","id":6490,"images":[{"contentType":"image","imageType":"main","name":"68125_0-0-2557-3840.jpeg"}],"slug":"gonul-dagi","title":"An Anatolian Tale","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Based on Elena Ferrante's novel, this series follows Elena Greco as she recounts her lifelong friendship with Lila, her bold and enigmatic childhood friend who suddenly vanishes. Grieving the loss, Elena begins to write about their shared past, uncovering hidden truths and complexities about their bond as she searches for answers to Lila’s mysterious disappearance.","id":492110,"images":[{"contentType":"image","imageType":"main","name":"53070_0-0-2557-3840.png"}],"slug":"lamica-geniale","title":"My Brilliant Friend","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"When summer commander Johan Berg returns to the South Pole, he discovers the entire research team is dead or missing, including his wife Annika. With the help of Maggie, the only survivor, Johan must uncover the truth behind the murders.\n","id":500037,"images":[{"contentType":"image","imageType":"main","name":"49968_0-0-2557-3840.jpeg"}],"slug":"the-head","title":"The Head","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"The chronicles of Saladin Ayyubi, a 12th-century Muslim ruler who aimed to unite the Muslim lands of Syria, northern Mesopotamia, Palestine, and Egypt against the Crusades; and the story of his conquest of Jerusalem.","id":231582,"images":[{"contentType":"image","imageType":"main","name":"43860_0-0-2557-3840.png"}],"slug":"kudus-fatihi-selahaddin-eyyubi","title":"Saladin: The Conqueror of Jerusalem","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}}],"pageItemType":"promoter","periods":null,"subscriptionCategories":null,"title":"Series"},{"description":"Focus on captivating moments in every scene with select films, and discover your favorite movies.","images":null,"info":"","items":[{"description":"Bilbo Baggins enjoys a quiet life in the Shire—until Gandalf and a band of dwarves sweep him into a daring quest. Facing trolls, goblins, and the cunning Gollum, Bilbo discovers courage and cleverness beyond his imagination as he journeys toward the legendary Lonely Mountain and the fearsome dragon Smaug.\n","id":546142,"images":[{"contentType":"image","imageType":"main","name":"54 e":"image","imageType":"main","name":"52460_0-0-2557-3840.png"}],"slug":"deliler-fatihin-fermani","title":"The Hunt for Vlad the Impaler","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"During a self-imposed exile in Arles and Auvers-sur-Oise, France, Dutch painter Vincent van Gogh develops his unique, colorful style of painting. While grappling with religion, mental illness, and a tumultuous friendship with French artist Paul Gauguin, Van Gogh begins to focus on his relationship with eternity rather than the pain his art causes him in the present.","id":524740,"images":[{"contentType":"image","imageType":"main","name":"52441_0-0-2557-3840.png"}],"slug":"at-eternitys-gate","title":"At Eternity's Gate","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Superintendent Emin and his team find themselves stumped by a perplexing serial killer case. Under mounting public and administrative scrutiny, their challenges escalate when a new crime expert is added to the team, exacerbating the already tense situation.","id":213268,"images":[{"contentType":"image","imageType":"main","name":"31243_0-0-2557-3840.jpeg"}],"slug":"cinayet-susu","title":"Make It Look Like A Murder","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"The Park family lives a good life with their inherited wealth. The Kim family, on the other hand, is poor, but they are hustlers who will do anything to raise their standard of living. These two families form a seemingly symbiotic relationship, which is a golden opportunity for the Kims. Having invented a profession for themselves, the children of the Kim family begin to move in and out of the Park household. Pretty soon, the symbiotic relationship turns into a parasitic one.","id":517601,"images":[{"contentType":"image","imageType":"main","name":"51616_0-0-2557-3840.png"}],"slug":"gisaengchung","title":"Parasite","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Airsoft enthusiasts Cenk, Cihan, and their friends accept a high-stakes challenge from a Russian team, lured by the promise of a cash prize. But once the match begins on a remote island, the lines between game and reality blur, turning their hobby into a deadly trap.","id":533240,"images":[{"contentType":"image","imageType":"main","name":"54680_0-0-2557-3840.png"}],"slug":"oyun-bitti","title":"Game Over","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"In 1879, ruthless gold mine tycoon and outlaw baron Bartholomew Bogue seizes control of Rose Creek, forcing its residents into labor and mercilessly killing those who resist. After her husband, Matthew Cullen, falls victim to Bogue’s cruelty, Emma Cullen sets out to gather a band of bounty hunters to free her town — and the battle begins.\n","id":543621,"images":[{"contentType":"image","imageType":"main","name":"54526_0-0-2557-3840.png"}],"slug":"magnificent-seven","title":"Magnificent Seven","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Ferdane, an unsuspecting woman, lives a simple life with her possessive husband Mustafa. When she notices strange changes in his behavior, she decides to follow him, only to find herself caught up in an unexpected adventure as more people get involved.","id":434428,"images":[{"contentType":"image","imageType":"main","name":"51071_0-0-2557-3840.png"}],"slug":"firincinin-karisi","title":"Baker's Wife","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Master of Wing Chun, Ip Man lives a quiet, humble life—training in solitude and fighting in underground matches. But when his homeland is invaded, he steps out of the shadows to defend his city with the only weapon he knows: his fists.","id":530468,"images":[{"contentType":"image","imageType":"main","name":"52963_0-0-2557-3840.jpeg"}],"slug":"ip-man","title":"Ip Man","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Ben Cash raises his six children in isolation in the Pacific Northwest, focused on strict physical and intellectual growth. When his wife dies, their secluded life is upended as the children insist on returning to the city for her funeral, forcing Ben to face a world he tried to leave behind.","id":536123,"images":[{"contentType":"image","imageType":"main","name":"54047_0-0-2557-3840.png"}],"slug":"captain-fantastic","title":"Captain Fantastic","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Genç bir adam olan Overgård'ın hayatı, çıktığı uçak yolculuğundan sonra altüst olur. Overgård'ın uçağı, kutup bölgesinden geçtikleri sırada düşer. Hiçliğin ortasında, sert doğa koşulları ile baş başa kalan Overgård'ın önünde iki seçenek vardır: Ya görece güvenli olan sığınağında kalıp amansız doğa felaketlerinden kendisini koruyacak ya da sonunu bilmediği ölümcül bir yolculuğa çıkacaktır.","id":487274,"images":[{"contentType":"image","imageType":"main","name":"47852_0-0-2557-3840.jpeg"}],"slug":"arctic","title":"Arctic","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"After the death of his wife, Ed withdraws from life, but his daughter convinces him to move in with her family. While Ed's grandson Peter is initially happy, their relationship changes when Ed takes Peter's room, forcing him to move to the attic. Determined to get his room back, Peter enlists his friends and declares war on his grandfather.","id":517645,"images":[{"contentType":"image","imageType":"main","name":"51630_0-0-2557-3840.png"}],"slug":"the-war-with-grandpa","title":"War With Grandpa","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Sıtkı, the stingy head of the Mutlu family, and his wife Türkan, frustrated by his neglect, decide to rent a caravan after their therapist's suggestion. On their way to Antalya, their car breaks down, forcing them to visit Yavaşlar Village. As guests of the villagers, the couple realizes they have valuable lessons to share. This encounter brings together two cultures and aids a righteous cause.","id":444713,"images":[{"contentType":"image","imageType":"main","name":"45363_0-0-2557-3840.png"}],"slug":"gorevimiz-tatil","title":"Mission: Vacation","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"The humanity is about to cease to exist. A merchant father, his son, and their dog follow an old map to find a place to survive and arrive in a commune which requires a series of tests to settle.","id":155322,"images":[{"contentType":"image","imageType":"main","name":"35879_0-0-2557-3840.png"}],"slug":"gocebe","title":"Nomad","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Brothers Hakan and Ozan, both successful musicians with contrasting personalities, have been estranged since childhood. Their father's funeral brings them together after years apart. Initially planning to fulfill their duties and part ways, they soon discover a will that changes everything.","id":462109,"images":[{"contentType":"image","imageType":"main","name":"46296_0-0-2557-3840.png"}],"slug":"kardesim-benim","title":"My Brother","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"In 6th-century Makkah, amidst the tumultuous era dubbed the \"Age of Ignorance\", Prophet Muhammad receives a divine visitation from the angel Gabriel. Defying the city's elders, he courageously calls upon people to embrace the belief in a singular deity. After prevailing over the Makkan army, the Muslim forces set off on a swift mission to propagate Islam across the Arabian Peninsula.","id":333502,"images":[{"contentType":"image","imageType":"main","name":"37082_0-0-2557-3840.png"}],"slug":"the-message","title":"The Message","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"A village boy from Northeastern Türkiye, a tough soldier and a terrorist cross each other's paths that turns into a heroic battle of patriotism and devotion.","id":153523,"images":[{"contentType":"image","imageType":"main","name":"21500_0-0-2557-3840.jpeg"}],"slug":"kesisme-iyi-ki-varsin-eren","title":"Eren: A Boy's Valor","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"In the near future, humanity faces doom, and our choices are dictated by an AI simulation. Unfortunately for the AI, it is indifferent to whether we survive or not. In this precarious scenario, an astronaut must choose between continuing his life's work through the night or sabotaging all his efforts for the greater good.","id":387386,"images":[{"contentType":"image","imageType":"main","name":"38733_0-0-2557-3840.jpeg"}],"slug":"a-million-days","title":"A Million Days","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}}],"pageItemType":"promoter","periods":null,"subscriptionCategories":null,"title":"Movies"},{"description":"Embark on an enlightening journey with curated selections from tabii’s boundless documentary archive.","images":null,"info":"","items":[{"description":"Throughout history, the rulers have been waging a relentless battle to confuse their enemies and gain public support, recently with advisors who don't know how to handle a weapon. When they take the stage, fiction and reality become completely entangled and the game of shadows begins.","id":301849,"images":[{"contentType":"image","imageType":"main","name":"44666_0-0-2557-3840.png"}],"slug":"golge-oyunu","title":"How to Craft War Propaganda","trailer":{"contentType":"","id":0,"isRepetition":false,"title":""}},{"description":"Hidden within the shelves of the Vatican Apostolic Archives are secrets linking Türkiye and the Islamic world to the Holy See. Historian Dr. Rinaldo Marmara, with his passion for history and exclusive access, uncovers documents that reveal exciting and previously unknown aspects
